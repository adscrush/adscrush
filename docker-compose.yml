services:
  postgres:
    image: postgres:16-alpine
    container_name: adscrush-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: adscrush
      POSTGRES_USER: adscrush
      POSTGRES_PASSWORD: adscrush
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c wal_level=replica
      -c max_wal_senders=5
      -c random_page_cost=1.1
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adscrush"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: adscrush-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgres://adscrush:adscrush@postgres:5432/adscrush
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "adscrush", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adscrush-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: adscrush-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://adscrush:adscrush@pgbouncer:6432/adscrush
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  tracking:
    build:
      context: .
      dockerfile: apps/tracking/Dockerfile
    container_name: adscrush-tracking
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://adscrush:adscrush@pgbouncer:6432/adscrush
      - REDIS_URL=redis://redis:6379
      - TRACKING_PORT=3002
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me}
    volumes:
      - ./data:/var/lib/geoip:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://api:4000
        NEXT_PUBLIC_TRPC_API_URL: http://api:4000/trpc
        NEXT_PUBLIC_TRACKING_DOMAIN: http://tracking:3002
        NEXT_PUBLIC_BUNNY_CDN_URL: ${NEXT_PUBLIC_BUNNY_CDN_URL:-}
    container_name: adscrush-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://adscrush:adscrush@pgbouncer:6432/adscrush
      - REDIS_URL=redis://redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  redisdata:
